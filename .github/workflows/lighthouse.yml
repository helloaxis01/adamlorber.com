name: Lighthouse CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: lighthouse-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Performance & accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Lighthouse CI
        run: npm install --global @lhci/cli@0.14.x

      - name: Run Lighthouse CI
        id: lhci
        run: |
          set -o pipefail
          lhci autorun --config=./.lighthouserc.json | tee lhci-output.txt

      - name: Write job summary
        if: always() && hashFiles('lhci-output.txt') != ''
        run: |
          {
            echo "## Lighthouse CI"
            echo ""
            echo "Routes: \`/\`, \`/about\`, \`/fount\`"
            echo ""
            echo '```'
            # Keep the summary readable — last ~80 lines usually hold assert + upload URLs
            tail -n 80 lhci-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Lighthouse artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-results
          path: |
            .lighthouseci/
            lhci-output.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Comment on pull request
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '## Lighthouse CI\n\n';
            body += 'Checked \`/\`, \`/about\`, and \`/fount\` against score floors '
              + '(perf ≥ 0.90, a11y ≥ 0.95, best-practices ≥ 0.90, SEO ≥ 0.95).\n\n';

            if (fs.existsSync('lhci-output.txt')) {
              const log = fs.readFileSync('lhci-output.txt', 'utf8');
              const urls = [...log.matchAll(/https:\/\/storage\.googleapis\.com\/[^\s]+/g)]
                .map((m) => m[0]);
              const unique = [...new Set(urls)];
              if (unique.length) {
                body += '### Reports\n';
                for (const url of unique.slice(0, 12)) {
                  body += `- ${url}\n`;
                }
                body += '\n';
              }
              const assertBlock = log.split(/\n/).slice(-60).join('\n');
              body += '<details><summary>Assert output (tail)</summary>\n\n```\n'
                + assertBlock
                + '\n```\n</details>\n';
            } else {
              body += '_No Lighthouse log found — see the workflow run for details._\n';
            }

            body += `\n[Workflow run](${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID})`;

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const marker = '<!-- lighthouse-ci-bot -->';
            body = marker + '\n' + body;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
