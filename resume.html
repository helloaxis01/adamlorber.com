<style>
  :root{
    --bg:#1a1a19; --ink:#dcdad3; --ink-dim:#8f8d85; --gold:#dcdad3; --chartreuse:#ebff12;
    --line:rgba(220,218,211,0.16);
    --serif:'Fraunces',serif; --grotesk:'Archivo',sans-serif; --mono:'IBM Plex Mono',monospace;
    --maxw:1320px;
    --gutter:clamp(20px,5vw,64px);
  }
  html[data-theme="light"]{
    --bg:#efeee9; --ink:#1a1a19; --ink-dim:#6b6963; --gold:#1a1a19;
    --line:rgba(26,26,25,0.14);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{background:var(--bg); color:var(--ink); font-family:var(--grotesk); font-weight:400; min-height:100%; display:flex; flex-direction:column;}
  a{color:inherit; text-decoration:none;}
  :focus-visible{outline:2px solid var(--gold); outline-offset:3px;}
  .wrap{max-width:var(--maxw); margin:0 auto; padding-inline:var(--gutter);}

  header{position:fixed; top:0; left:0; right:0; z-index:110; background-color:color-mix(in srgb, var(--bg) 78%, transparent); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); border-bottom:1px solid transparent;}
  header.scrolled{background-color:color-mix(in srgb, var(--bg) 94%, transparent); border-color:var(--line);}
  nav{max-width:100%; margin:0 auto; padding:26px var(--gutter); display:flex; align-items:center; justify-content:space-between;}
  .logo{font-family:var(--grotesk); font-weight:800; font-size:13px; letter-spacing:0.16em; text-transform:uppercase; color:var(--ink);}
  .nav-right{display:flex; align-items:center; gap:14px;}
  .theme-toggle{
    background:none; border:1px solid var(--line); color:var(--ink-dim);
    font-family:var(--mono); font-size:10px; letter-spacing:0.12em; text-transform:uppercase;
    padding:7px 10px; cursor:pointer; border-radius:1px; min-width:5.75em; text-align:center;
  }
  .theme-toggle:hover{color:var(--chartreuse);}
  html[data-theme="light"] .theme-toggle:hover{color:#1a1a19; background:var(--chartreuse);}
  .burger{display:flex; flex-direction:column; gap:5px; background:none; border:none; cursor:pointer; padding:6px; z-index:110;}
  .burger span{width:22px; height:2px; background:var(--ink); display:block; transition:transform .25s ease, opacity .25s ease;}
  .burger.open span:nth-child(1){transform:translateY(7px) rotate(45deg);}
  .burger.open span:nth-child(2){opacity:0;}
  .burger.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg);}
  .menu{position:fixed; inset:0; background:var(--bg); z-index:105; display:flex; flex-direction:column; justify-content:center; gap:22px; padding:0 32px; transform:translateY(-100%); transition:transform .45s cubic-bezier(.65,0,.35,1);}
  .menu.open{transform:translateY(0);}
  .menu a{font-family:var(--serif); font-weight:500; font-size:44px;}
  .menu .m-eyebrow{font-family:var(--mono); font-size:11px; letter-spacing:0.16em; text-transform:uppercase; color:var(--gold);}

  main{flex:1; display:flex; flex-direction:column; padding-top:96px; min-height:0;}
  .resume-bar{
    display:flex; flex-wrap:wrap; align-items:baseline; justify-content:space-between; gap:16px 24px;
    padding:18px 0 16px; border-bottom:1px solid var(--line);
  }
  .resume-bar .eyebrow{font-family:var(--mono); font-size:11px; letter-spacing:0.16em; text-transform:uppercase; color:var(--ink-dim);}
  .resume-actions{display:flex; flex-wrap:wrap; gap:18px; align-items:center;}
  .resume-actions a{
    font-family:var(--mono); font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--ink-dim);
  }
  .resume-actions a:hover{color:var(--chartreuse);}
  html[data-theme="light"] .resume-actions a:hover{color:var(--ink); background:var(--chartreuse); padding-inline:0.35em; margin-inline:-0.35em;}
  .resume-frame-wrap{
    flex:1; min-height:70vh; margin:18px 0 28px; border:1px solid var(--line); background:#111;
    overflow:hidden;
  }
  html[data-theme="light"] .resume-frame-wrap{background:#fff;}
  .resume-frame-wrap iframe,
  .resume-frame-wrap object{
    width:100%; height:100%; min-height:70vh; border:0; display:block;
  }
  .resume-fallback{
    font-size:14px; line-height:1.6; color:var(--ink-dim); padding:28px; max-width:36em;
  }
  .resume-fallback a{color:var(--ink); text-decoration:underline; text-underline-offset:3px;}
  footer.wrap{padding:28px var(--gutter) 36px; font-family:var(--mono); font-size:10px; color:var(--ink-dim); display:flex; justify-content:space-between; border-top:1px solid var(--line);}
</style>

<body>
<header id="siteHeader">
  <nav>
    <a href="/" class="logo">Adam Lorber</a>
    <div class="nav-right">
      <button class="theme-toggle" type="button" id="themeToggle" aria-label="Switch to light theme" data-theme="dark"><span class="theme-toggle-label">Light</span></button>
      <button class="burger" aria-label="Open menu" id="burgerBtn"><span></span><span></span><span></span></button>
    </div>
  </nav>
</header>

<div class="menu" id="menu">
  <span class="m-eyebrow">Menu</span>
  <a href="/">Home</a>
  <a href="/#work">Work</a>
  <a href="/#studies">Studies</a>
  <a href="/about">About</a>
  <a href="/#contact">Contact</a>
</div>

<main class="wrap">
  <div class="resume-bar">
    <p class="eyebrow">Resume</p>
    <div class="resume-actions">
      <a href="/resume.pdf" target="_blank" rel="noopener">Open PDF</a>
      <a href="/resume.pdf" download="Resume_AdamLorber.pdf">Download PDF</a>
      <a href="/about">Back to About</a>
    </div>
  </div>
  <div class="resume-frame-wrap">
    <object data="/resume.pdf#view=FitH" type="application/pdf" aria-label="Adam Lorber resume">
      <div class="resume-fallback">
        <p>Your browser can’t display the PDF here.</p>
        <p><a href="/resume.pdf" target="_blank" rel="noopener">Open the resume</a> or <a href="/resume.pdf" download="Resume_AdamLorber.pdf">download the PDF</a>.</p>
      </div>
    </object>
  </div>
</main>

<footer class="wrap">
  <span>© 2026 Adam Lorber</span>
  <a href="/">Home</a>
</footer>

<script>
  const header = document.getElementById('siteHeader');
  let headerScrolled = false, headerTicking = false;
  function updateHeader(){
    headerTicking = false;
    const y = window.scrollY || 0;
    const next = headerScrolled ? y > 4 : y > 16;
    if (next !== headerScrolled){
      headerScrolled = next;
      header.classList.toggle('scrolled', headerScrolled);
    }
  }
  window.addEventListener('scroll', () => {
    if (!headerTicking){ headerTicking = true; requestAnimationFrame(updateHeader); }
  }, { passive: true });
</script>
<script src="site.js"></script>
</body>
