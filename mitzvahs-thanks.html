<style>
  :root{
    --bg:#10131a; --ink:#f3eee6; --ink-dim:#a79f92; --gold:#d2b48c;
    --serif:'Cormorant Garamond', Georgia, serif; --sans:'Outfit', system-ui, sans-serif;
    --gutter:clamp(20px,5vw,72px);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--ink); font-family:var(--sans); min-height:100vh; display:flex; align-items:center;
    background-image:
      radial-gradient(ellipse 80% 55% at 70% -10%, rgba(210,180,140,0.16), transparent 55%),
      radial-gradient(ellipse 60% 40% at 10% 30%, rgba(90,110,140,0.12), transparent 50%);
  }
  a{color:var(--gold);}
  .wrap{max-width:720px; margin:0 auto; padding:80px var(--gutter);}
  .eyebrow{font-size:12px; letter-spacing:0.16em; text-transform:uppercase; color:var(--ink-dim); margin-bottom:16px;}
  h1{font-family:var(--serif); font-weight:500; font-size:clamp(36px,6vw,64px); line-height:1.05; margin-bottom:18px;}
  p{font-size:16px; line-height:1.7; color:var(--ink-dim); max-width:34em;}
  .actions{margin-top:36px; display:flex; flex-wrap:wrap; gap:18px;}
  .actions a{font-size:13px; letter-spacing:0.08em; text-transform:uppercase; text-decoration:none; color:var(--ink-dim);}
  .actions a:hover{color:var(--gold);}
</style>

    <p class="eyebrow">Bespoke Mitzvahs</p>

  </div>
