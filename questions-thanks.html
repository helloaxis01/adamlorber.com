<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Thanks · Adam Lorber</title>
<link rel="icon" href="/favicon.ico?v=4" sizes="any">
<link rel="icon" href="/favicon.svg?v=4" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=4">
<script>!function(){try{var t=localStorage.getItem("theme");if(t==="light")document.documentElement.setAttribute("data-theme","light")}catch(e){}}()</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;1,400&family=Archivo:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1a1a19; --ink:#dcdad3; --ink-dim:#8f8d85; --gold:#dcdad3; --chartreuse:#ebff12;
    --serif:'Fraunces',serif; --grotesk:'Archivo',sans-serif; --mono:'IBM Plex Mono',monospace;
    --gutter:clamp(20px,5vw,64px);
  }
  html[data-theme="light"]{
    --bg:#efeee9; --ink:#1a1a19; --ink-dim:#6b6963; --gold:#1a1a19;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--bg); color:var(--ink); font-family:var(--grotesk); min-height:100vh; display:flex; align-items:center;}
  a{color:inherit;}
  .wrap{max-width:720px; margin:0 auto; padding:80px var(--gutter);}
  .eyebrow{font-family:var(--mono); font-size:11px; letter-spacing:0.16em; text-transform:uppercase; color:var(--ink-dim); margin-bottom:18px;}
  h1{font-family:var(--serif); font-weight:500; font-size:clamp(36px,6vw,64px); line-height:1.05; margin-bottom:18px;}
  p{font-size:16px; line-height:1.7; color:var(--ink-dim); max-width:36em;}
  .actions{margin-top:36px; display:flex; flex-wrap:wrap; gap:18px;}
  .actions a{font-family:var(--mono); font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--ink-dim);}
  .actions a:hover{color:var(--chartreuse);}
  html[data-theme="light"] .actions a:hover{color:var(--ink); background:var(--chartreuse);}
</style>
</head>
<body>
  <div class="wrap">
    <p class="eyebrow">Questions</p>
    <h1>Thanks!</h1>
    <p>Your answers are in. I'll be in touch shortly. Forgot to add something? Email <a href="mailto:hello@adamlorber.com">hello@adamlorber.com</a>.</p>
    <div class="actions">
      <a href="/">adamlorber.com</a>
      <a href="/questions">Return to form</a>
    </div>
  </div>
</body>
</html>
